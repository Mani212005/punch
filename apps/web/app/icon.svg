<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#F3EFE6"/>
  <!-- 4-quadrant Bauhaus mark -->
  <!-- Red circle top-left -->
  <circle cx="10" cy="10" r="6" fill="#E4321B"/>
  <!-- Blue square top-right -->
  <rect x="16" y="4" width="12" height="12" fill="#1F48C5"/>
  <!-- Ink square bottom-left -->
  <rect x="4" y="16" width="12" height="12" fill="#121212"/>
  <!-- Yellow triangle bottom-right -->
  <polygon points="22,16 28,28 16,28" fill="#F5C518"/>
</svg>
